services:
  # ==========================================
  # BANCO DE DADOS (compartilhado pelas APIs: order-api, payment-api, invoice-api)
  # ==========================================
  postgres-api:
    image: postgres:15-alpine
    container_name: postgres-api
    environment:
      POSTGRES_DB: apisdb
      POSTGRES_USER: apis_user
      POSTGRES_PASSWORD: apis_password
    ports:
      - "5432:5432"
    networks:
      - lab-network

  # ==========================================
  # MENSAGERIA (Apache Kafka - modo KRaft, sem Zookeeper)
  # ==========================================

  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka-orderslab
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - lab-network

  # UI de administração/visualização do Kafka (Kafbat UI, fork mantido pela
  # comunidade do antigo provectuslabs/kafka-ui)
  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kafbat-ui-orderslab
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: orderslab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - lab-network

  # ==========================================
  # INFRAESTRUTURA BASE (ainda não utilizada nesta fase)
  # ==========================================

  # Banco de Dados para o Keycloak
  # postgres-keycloak:
  #   image: postgres:15-alpine
  #   container_name: postgres-keycloak
  #   environment:
  #     POSTGRES_DB: keycloak
  #     POSTGRES_USER: keycloak
  #     POSTGRES_PASSWORD: keycloak_password
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - lab-network

  # Identity Provider (Keycloak)
  # keycloak:
  #   image: quay.io/keycloak/keycloak:24.0.1
  #   container_name: keycloak
  #   environment:
  #     KC_BOOTSTRAP_ADMIN_USERNAME: admin
  #     KC_BOOTSTRAP_ADMIN_PASSWORD: admin
  #     KC_DB: postgres
  #     KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
  #     KC_DB_USERNAME: keycloak
  #     KC_DB_PASSWORD: keycloak_password
  #   command: start-dev
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     - postgres-keycloak
  #   networks:
  #     - lab-network

  # ==========================================
  # MICROSSERVIÇOS (SPRING BOOT)
  # ==========================================

  order-service:
    build:
      context: ../order-api
      dockerfile: Dockerfile
    container_name: order-api
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-api:5432/apisdb
      - SPRING_DATASOURCE_USERNAME=apis_user
      - SPRING_DATASOURCE_PASSWORD=apis_password
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - postgres-api
      - kafka
    networks:
      - lab-network

  payment-service:
    build:
      context: ../payment-api
      dockerfile: Dockerfile
    container_name: payment-api
    ports:
      - "8082:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-api:5432/apisdb
      - SPRING_DATASOURCE_USERNAME=apis_user
      - SPRING_DATASOURCE_PASSWORD=apis_password
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - postgres-api
      - kafka
    networks:
      - lab-network

  invoice-service:
    build:
      context: ../invoice-api
      dockerfile: Dockerfile
    container_name: invoice-api
    ports:
      - "8083:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-api:5432/apisdb
      - SPRING_DATASOURCE_USERNAME=apis_user
      - SPRING_DATASOURCE_PASSWORD=apis_password
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - postgres-api
      - kafka
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge
