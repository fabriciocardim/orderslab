apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: orderslab
  labels:
    app: prometheus
data:
  # Equivalente a infra/prometheus.yml — sem scrape_configs, ingestão é só via OTLP
  # (--web.enable-otlp-receiver no Deployment), research.md, Decisão 3.
  prometheus.yml: |
    global:
      scrape_interval: 15s
