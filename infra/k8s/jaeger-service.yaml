apiVersion: v1
kind: Service
metadata:
  labels:
    app: jaeger
  name: jaeger
  namespace: orderslab
spec:
  type: LoadBalancer
  ports:
    - name: "4317"
      port: 4317
      targetPort: 4317
    - name: "4318"
      port: 4318
      targetPort: 4318
    - name: "16686"
      port: 16686
      targetPort: 16686
  selector:
    app: jaeger
