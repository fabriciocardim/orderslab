apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: loki
  name: loki
  namespace: orderslab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - image: grafana/loki:3.7.8
          name: loki
          # spec 022: limite igual ao do Compose; request = metade (cluster local, 3 réplicas das APIs)
          resources:
            requests:
              memory: 192Mi
            limits:
              memory: 384Mi
          ports:
            - containerPort: 3100
              protocol: TCP
      restartPolicy: Always
