apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: order-service
  name: order-service
  namespace: orderslab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        # Nenhuma env var de OTLP aqui: application.properties já aponta para
        # http://otel-collector:4318/... e o Service otel-collector (infra/k8s/
        # otel-collector-service.yaml) usa o mesmo hostname/porta — resolve sem
        # necessidade de override, igual ao Docker Compose (T010).
        - env:
            - name: SPRING_DATASOURCE_PASSWORD
              value: order_password
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-api:5432/order_db
            - name: SPRING_DATASOURCE_USERNAME
              value: order_user
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:29092
          image: order-service
          imagePullPolicy: Never
          name: order-api
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
