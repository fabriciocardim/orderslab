apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: invoice-service
  name: invoice-service
  namespace: orderslab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: invoice-service
  template:
    metadata:
      labels:
        app: invoice-service
    spec:
      containers:
        # Nenhuma env var de OTLP aqui: application.properties já aponta para
        # http://otel-collector:4318/... e o Service otel-collector (infra/k8s/
        # otel-collector-service.yaml) usa o mesmo hostname/porta — resolve sem
        # necessidade de override, igual ao Docker Compose (T010).
        - env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=65"
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "1.0"
            - name: SPRING_JPA_SHOW_SQL
              value: "false"
            - name: SPRING_DATASOURCE_PASSWORD
              value: invoice_password
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-api:5432/invoice_db
            - name: SPRING_DATASOURCE_USERNAME
              value: invoice_user
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:29092
          image: invoice-service
          imagePullPolicy: Never
          name: invoice-api
          # spec 022: limite igual ao do Compose; request = metade (cluster local, 3 réplicas das APIs)
          resources:
            requests:
              memory: 384Mi
            limits:
              memory: 768Mi
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
