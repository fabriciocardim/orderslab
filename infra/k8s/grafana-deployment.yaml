apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: grafana
  name: grafana
  namespace: orderslab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - image: grafana/grafana:13.2.3
          name: grafana
          # spec 022: limite igual ao do Compose; request = metade (cluster local, 3 réplicas das APIs)
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          ports:
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
      restartPolicy: Always
