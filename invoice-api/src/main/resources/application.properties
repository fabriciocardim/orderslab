spring.application.name=invoice-api

spring.datasource.url=jdbc:postgresql://localhost:5432/invoice_db
spring.datasource.username=invoice_user
spring.datasource.password=invoice_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.kafka.bootstrap-servers=localhost:9092

management.tracing.sampling.probability=1.0
logging.structured.format.console=ecs
management.endpoints.web.exposure.include=health,metrics

spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

spring.kafka.consumer.group-id=invoice-api
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.allow.auto.create.topics=false
spring.kafka.listener.observation-enabled=true

outbox.relay.interval-ms=1000
outbox.relay.batch-size=100
outbox.relay.send-timeout-ms=15000

invoice.issuance.limit=500.00

consumer.retry.max-retries=4
consumer.retry.initial-interval-ms=1000
consumer.retry.multiplier=2.0
consumer.retry.max-interval-ms=10000

spring.datasource.hikari.connection-timeout=5000
