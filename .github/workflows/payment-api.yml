name: payment-api

on:
  push:
    branches: ['**']
    tags:
      - 'payment-api-v*.*.*'
  pull_request:
    branches: [develop, main]
    paths:
      - 'payment-api/**'
      - '.github/workflows/payment-api.yml'
      - '.github/workflows/service-ci.yml'

jobs:
  ci:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/service-ci.yml
    with:
      service-name: payment-api
