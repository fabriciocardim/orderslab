name: invoice-api

on:
  push:
    branches: [develop, main]
    tags:
      - 'invoice-api-v*.*.*'
  pull_request:
    branches: [develop, main]
    paths:
      - 'invoice-api/**'
      - '.github/workflows/invoice-api.yml'
      - '.github/workflows/service-ci.yml'

jobs:
  ci:
    uses: ./.github/workflows/service-ci.yml
    with:
      service-name: invoice-api
