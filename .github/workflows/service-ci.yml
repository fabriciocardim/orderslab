name: Service CI

# Workflow reusável com os jobs comuns a qualquer microsserviço Spring Boot
# do monorepo (order-api, payment-api, invoice-api). É chamado pelos
# workflows finos de cada serviço — não dispara sozinho.

on:
  workflow_call:
    inputs:
      service-name:
        description: "Nome do serviço / pasta no monorepo (ex.: order-api)"
        required: true
        type: string

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ inputs.service-name }}/pom.xml

      - name: Build e testes (mvnw verify)
        run: ./mvnw -B clean verify

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ inputs.service-name }}
          path: ${{ inputs.service-name }}/target/surefire-reports/
          retention-days: 7

  quality:
    name: Quality (PMD)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ inputs.service-name }}/pom.xml

      - name: PMD (mvnw pmd:check)
        run: ./mvnw -B pmd:check

      - name: Publicar relatório PMD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report-${{ inputs.service-name }}
          path: ${{ inputs.service-name }}/target/pmd.xml
          retention-days: 7

  security:
    name: Security (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ${{ inputs.service-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ inputs.service-name }}/pom.xml

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build (sem testes, só para o CodeQL rastrear a compilação)
        run: ./mvnw -B clean package -DskipTests

      - name: Analisar com CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-${{ inputs.service-name }}"

  package:
    name: Package (Docker)
    needs: [build-and-test, quality, security]
    # Release por tag: só builda a imagem quando a tag empurrada bate com
    # o padrão "<service-name>-vX.Y.Z" (ver workflow chamador). Ainda não
    # há registry configurado — quando houver, o push da imagem entra aqui.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extrair versão da tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#${{ inputs.service-name }}-v}" >> "$GITHUB_OUTPUT"

      - name: Build da imagem Docker
        run: docker build -t ${{ inputs.service-name }}:${{ steps.version.outputs.version }} ${{ inputs.service-name }}
